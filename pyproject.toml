[project]
name = "multilingual-entropy-study"
version = "0.1.0"
description = "A reproducible comparison of cross-language entropy patterns under byte n-grams and multilingual LLMs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Aaron Bergman" }]
dependencies = [
  "huggingface-hub>=0.34",
  "matplotlib>=3.10",
  "mlx-lm>=0.29.1",
  "numpy>=2.2",
  "pandas>=2.2",
  "pyarrow>=19",
  "scipy>=1.15",
  "seaborn>=0.13",
  "tqdm>=4.67",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multilingual_entropy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
